<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Нонограмма">
  <title>Японский кроссворд — Нонограмма</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2305060f'/%3E%3Crect x='20' y='20' width='60' height='60' fill='none' stroke='%23663af3' stroke-width='8'/%3E%3Crect x='35' y='35' width='30' height='30' fill='%23663af3'/%3E%3C/svg%3E">
  <style>
    :root {
      --color-midnight-canvas: #05060f;
      --color-steel-plate: #2f343e;
      --color-fog-veil: #9da7ba;
      --color-moon-mist: #c7d3ea;
      --color-frost-glow: #d1e4fa;
      --color-ice-highlight: #d8ecf8;
      --color-pure-white: #ffffff;
      --color-void-violet: #663af3;
      --color-blueprint-blue: #b6d9fc;
      --color-glass-edge: #bad7f71f;
      --color-luminous-fill: #c7d3ea1f;
      --shadow-sm: rgba(186, 207, 247, 0.32) 0px 0px 6px 0px;
      --shadow-md: rgba(238, 186, 247, 0.24) 0px 0px 12px 0px;
      --shadow-subtle: rgba(186, 215, 247, 0.12) 0px 0px 0px 1px inset;
      --shadow-subtle-6: rgba(216, 236, 248, 0.2) 0px 1px 1px 0px inset, rgba(168, 216, 245, 0.06) 0px 24px 48px 0px inset, rgba(0, 0, 0, 0.3) 0px 16px 32px 0px;
      --radius-cards: 16px;
      --radius-badges: 6px;
      --radius-inputs: 6px;
      --radius-modals: 16px;
      --radius-buttons: 999px;
      --radius-iconcontainers: 9999px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
      -webkit-touch-callout: none; 
    }
    
    html, body { 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      position: fixed; 
      overscroll-behavior: none; 
      background: var(--color-midnight-canvas); 
      color: var(--color-frost-glow); 
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; 
      transition: background 0.25s ease, color 0.25s ease; 
      touch-action: none;
    }
    
    body { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: space-between; 
      user-select: none; 
    }

    #app { 
      width: 100%; 
      height: 100%; 
      display: flex; 
      flex-direction: column; 
      max-width: 800px; 
      padding: 8px; 
      position: relative;
    }

    #top-bar { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      gap: 8px; 
      padding: 4px 0 8px; 
      flex-shrink: 0; 
    }
    
    .top-btn { 
      background: var(--color-luminous-fill); 
      border: none; 
      border-radius: var(--radius-buttons); 
      box-shadow: var(--shadow-subtle); 
      width: 44px; 
      height: 44px; 
      font-size: 20px; 
      cursor: pointer; 
      color: var(--color-frost-glow); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      transition: all 0.2s; 
      backdrop-filter: blur(10px);
    }
    
    .top-btn:active { 
      transform: scale(0.94); 
      background: var(--color-steel-plate); 
    }
    
    #puzzle-title { 
      font-weight: 500; 
      font-size: 16px; 
      text-align: center; 
      flex: 1; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      color: var(--color-ice-highlight);
      letter-spacing: -0.01em;
    }
    
    #stats { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      font-size: 14px; 
    }
    
    #error-count { 
      color: #e46d4c; 
      font-weight: 500; 
    }
    
    #timer { 
      font-variant-numeric: tabular-nums; 
      color: var(--color-moon-mist);
    }

    #canvas-wrap { 
      flex: 1; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden; 
      border-radius: var(--radius-cards); 
      background: rgba(186, 214, 247, 0.03); 
      box-shadow: var(--shadow-subtle-6); 
      margin-bottom: 8px; 
      touch-action: none; 
      min-height: 0;
      backdrop-filter: blur(10px);
    }
    
    canvas { 
      display: block; 
      touch-action: none; 
      border-radius: 8px; 
    }

    #bottom-bar { 
      display: flex; 
      gap: 6px; 
      padding: 8px 0; 
      flex-shrink: 0; 
      flex-wrap: wrap; 
      justify-content: center; 
      align-items: center;
    }
    
    .bottom-btn { 
      background: var(--color-luminous-fill); 
      border: none; 
      border-radius: var(--radius-buttons); 
      box-shadow: var(--shadow-subtle); 
      font-size: 14px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 4px; 
      color: var(--color-frost-glow); 
      transition: all 0.2s; 
      font-weight: 500; 
      padding: 8px 12px;
      height: 44px;
      backdrop-filter: blur(10px);
    }
    
    .bottom-btn.active { 
      background: var(--color-void-violet); 
      color: white; 
      box-shadow: 0 0 12px rgba(102, 58, 243, 0.5);
    }
    
    .bottom-btn:active { 
      transform: scale(0.95); 
    }
    
    .bottom-btn.small { 
      width: 44px;
      padding: 8px;
      font-size: 18px; 
    }

    .modal-overlay { 
      position: fixed; 
      inset: 0; 
      background: rgba(5, 6, 15, 0.8); 
      backdrop-filter: blur(8px); 
      z-index: 100; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.3s; 
    }
    
    .modal-overlay.show { 
      opacity: 1; 
      pointer-events: auto; 
    }
    
    .modal { 
      background: rgba(5, 6, 15, 0.97); 
      width: 90%; 
      max-width: 720px; 
      max-height: 85%; 
      overflow-y: auto; 
      border-radius: var(--radius-modals); 
      padding: 24px; 
      box-shadow: var(--shadow-subtle-6); 
      transform: translateY(30px); 
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2); 
      border: 1px solid var(--color-glass-edge);
    }
    
    .modal-overlay.show .modal { 
      transform: translateY(0); 
    }
    
    .modal h2, .modal h3 { 
      margin-bottom: 16px; 
      color: var(--color-ice-highlight);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    
    .modal-close { 
      float: right; 
      background: none; 
      border: none; 
      font-size: 28px; 
      cursor: pointer; 
      color: var(--color-frost-glow); 
    }

    .level-group { 
      margin-bottom: 18px; 
    }
    
    .level-group h3 { 
      font-size: 16px; 
      margin-bottom: 8px; 
      color: var(--color-blueprint-blue); 
      font-weight: 500;
    }
    
    .cards { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
      gap: 10px; 
    }
    
    .level-card { 
      background: rgba(186, 214, 247, 0.03); 
      border-radius: var(--radius-cards); 
      padding: 8px; 
      box-shadow: var(--shadow-subtle); 
      cursor: pointer; 
      transition: all 0.3s; 
      text-align: center; 
      border: 1px solid var(--color-glass-edge);
    }
    
    .level-card:hover { 
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    .level-card:active { 
      transform: scale(0.96); 
    }
    
    .level-card canvas { 
      width: 100%; 
      border-radius: 8px; 
      background: rgba(199, 211, 234, 0.06);
    }
    
    .level-card .name { 
      font-size: 13px; 
      font-weight: 500; 
      margin-top: 4px; 
      color: var(--color-frost-glow);
    }
    
    .level-card .meta { 
      font-size: 11px; 
      opacity: 0.8; 
      color: var(--color-moon-mist);
    }
    
    .level-card.solved { 
      border: 2px solid #269684; 
    }
    
    .level-card .stars {
      color: #ffd700;
      font-size: 12px;
      margin-top: 2px;
    }
    
    .checkmark { 
      color: #269684; 
      font-size: 18px; 
    }

    .action-row { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      margin-top: 16px; 
    }
    
    .action-btn { 
      background: var(--color-luminous-fill); 
      border: 1px solid var(--color-glass-edge); 
      padding: 12px 18px; 
      border-radius: var(--radius-buttons); 
      font-size: 15px; 
      cursor: pointer; 
      box-shadow: var(--shadow-subtle); 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      color: var(--color-frost-glow); 
      transition: all 0.3s; 
      backdrop-filter: blur(10px);
    }
    
    .action-btn:hover {
      background: var(--color-steel-plate);
    }
    
    .action-btn.primary { 
      background: var(--color-void-violet); 
      color: white; 
      box-shadow: 0 0 12px rgba(102, 58, 243, 0.5);
    }
    
    .action-btn.primary:hover {
      background: #7c5af5;
    }
    
    .action-btn:active { 
      transform: scale(0.95); 
    }

    .editor-grid { 
      display: flex; 
      gap: 15px; 
      flex-wrap: wrap; 
    }
    
    .editor-canvas { 
      border: 1px solid var(--color-glass-edge); 
      border-radius: 10px; 
      image-rendering: pixelated; 
    }
    
    .editor-tools { 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
    }
    
    .tool-btn { 
      background: var(--color-luminous-fill); 
      border: 1px solid var(--color-glass-edge); 
      border-radius: var(--radius-badges); 
      padding: 8px 14px; 
      cursor: pointer; 
      font-size: 14px; 
      color: var(--color-frost-glow);
    }
    
    .tool-btn.active { 
      background: var(--color-void-violet); 
      color: white; 
    }
    
    .editor-preview { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      color: var(--color-moon-mist);
    }

    #preview-container {
      margin-top: 16px;
      padding: 16px;
      background: rgba(186, 214, 247, 0.03);
      border-radius: var(--radius-cards);
      border: 1px solid var(--color-glass-edge);
    }
    
    #preview-container h3 {
      margin-bottom: 12px;
      color: var(--color-blueprint-blue);
    }
    
    #preview-canvas {
      display: block;
      margin: 0 auto;
      background: rgba(199, 211, 234, 0.06);
      border-radius: 8px;
    }

    /* Статистика */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    
    .stat-card {
      background: rgba(186, 214, 247, 0.03);
      border-radius: var(--radius-cards);
      padding: 16px;
      text-align: center;
      border: 1px solid var(--color-glass-edge);
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--color-ice-highlight);
      margin-bottom: 8px;
    }
    
    .stat-label {
      font-size: 12px;
      color: var(--color-moon-mist);
    }

    /* Анимации */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .modal.show {
      animation: fadeIn 0.3s ease-out;
    }

    @media (max-width: 600px) {
      .bottom-btn { 
        font-size: 13px; 
        height: 40px; 
        padding: 8px 10px;
      }
      .bottom-btn.small { 
        width: 40px;
        font-size: 16px; 
      }
      .top-btn { 
        width: 40px; 
        height: 40px; 
        font-size: 18px; 
      }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="top-bar">
    <button class="top-btn" id="btn-menu" aria-label="Меню">☰</button>
    <div id="puzzle-title">Нонограмма</div>
    <div id="stats">
      <span id="error-count">✕ 0</span>
      <span id="timer">⏱ 00:00</span>
      <button class="top-btn" id="btn-settings" aria-label="Настройки">⚙</button>
    </div>
  </div>
  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="bottom-bar">
    <button class="bottom-btn active" data-mode="paint">⬛ Закрасить</button>
    <button class="bottom-btn" data-mode="x">✕ Крестик</button>
    <button class="bottom-btn" data-mode="memo">🔺 Memo</button>
    <button class="bottom-btn" data-mode="memo-fraction">½ Дробь</button>
    <button class="bottom-btn small" id="btn-clear-memo" aria-label="Удалить memo" style="display:none;">🗑</button>
    <button class="bottom-btn small" id="btn-undo" aria-label="Отменить">↺</button>
    <button class="bottom-btn small" id="btn-redo" aria-label="Повторить">↻</button>
    <button class="bottom-btn small" id="btn-clear" aria-label="Очистить всё">✕</button>
    <button class="bottom-btn small" id="btn-hint" aria-label="Подсказка">💡</button>
  </div>
</div>

<!-- Модальные окна -->
<div class="modal-overlay" id="modal-menu">
  <div class="modal">
    <button class="modal-close" data-close="modal-menu">×</button>
    <h2>Меню</h2>
    <button class="action-btn" id="btn-levels">📚 Выбор уровня</button>
    <button class="action-btn" id="btn-daily">📅 Ежедневное задание</button>
    <button class="action-btn" id="btn-editor">🎨 Редактор</button>
    <button class="action-btn" id="btn-generate">✨ Сгенерировать</button>
    <button class="action-btn" id="btn-stats">📊 Статистика</button>
    <button class="action-btn" id="btn-settings">⚙️ Настройки</button>
  </div>
</div>

<div class="modal-overlay" id="modal-levels">
  <div class="modal">
    <button class="modal-close" data-close="modal-levels">×</button>
    <h2>Уровни</h2>
    <button class="action-btn" id="btn-random-level">🎲 Случайный уровень</button>
    <div id="levels-list"></div>
    <div id="preview-container" style="display:none;">
      <h3>Превью</h3>
      <canvas id="preview-canvas"></canvas>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-daily">
  <div class="modal">
    <button class="modal-close" data-close="modal-daily">×</button>
    <h2>📅 Ежедневное задание</h2>
    <div id="daily-info"></div>
    <button class="action-btn primary" id="btn-play-daily">▶ Играть</button>
  </div>
</div>

<div class="modal-overlay" id="modal-stats">
  <div class="modal">
    <button class="modal-close" data-close="modal-stats">×</button>
    <h2>📊 Статистика</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-solved">0</div>
        <div class="stat-label">Решено пазлов</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Всего пазлов</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-best-time">--:--</div>
        <div class="stat-label">Лучшее время</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-avg-errors">0</div>
        <div class="stat-label">Среднее ошибок</div>
      </div>
    </div>
    <div id="stats-chart" style="margin-top: 20px;"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-editor">
  <div class="modal">
    <button class="modal-close" data-close="modal-editor">×</button>
    <h2>Редактор</h2>
    <div class="editor-grid">
      <div>
        <canvas id="editor-canvas" width="300" height="300" class="editor-canvas"></canvas>
        <div style="margin-top:8px; color:var(--color-moon-mist);">Размер: <select id="editor-size" style="background:var(--color-steel-plate);color:var(--color-frost-glow);border:1px solid var(--color-glass-edge);border-radius:6px;padding:4px;"><option>5</option><option>10</option><option>15</option><option>20</option><option>30</option></select></div>
      </div>
      <div class="editor-tools">
        <button class="tool-btn active" data-tool="pencil">✏️ Карандаш</button>
        <button class="tool-btn" data-tool="eraser">🧹 Ластик</button>
        <button class="tool-btn" data-tool="fill">🪣 Заливка</button>
        <button class="tool-btn" data-tool="line">📏 Линия</button>
        <button class="tool-btn" data-tool="rect">⬜ Прямоугольник</button>
        <label style="color:var(--color-moon-mist);">Симметрия: <select id="editor-symmetry" style="background:var(--color-steel-plate);color:var(--color-frost-glow);border:1px solid var(--color-glass-edge);border-radius:6px;padding:4px;"><option value="none">Выключено</option><option value="v">Вертикальная</option><option value="h">Горизонтальная</option><option value="both">Обе</option></select></label>
        <button class="action-btn" id="editor-save">💾 Сохранить</button>
        <button class="action-btn" id="editor-export">📤 Экспорт</button>
        <button class="action-btn" id="editor-import">📥 Импорт</button>
        <button class="action-btn primary" id="editor-play">▶ Играть</button>
      </div>
      <div class="editor-preview">
        <span>Превью:</span>
        <canvas id="editor-preview" width="200" height="200"></canvas>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-settings">
  <div class="modal">
    <button class="modal-close" data-close="modal-settings">×</button>
    <h2>Настройки</h2>
    <label style="color:var(--color-moon-mist);"><input type="checkbox" id="setting-timer"> Показывать таймер</label><br>
    <label style="color:var(--color-moon-mist);"><input type="checkbox" id="setting-sound"> Звук</label><br>
    <label style="color:var(--color-moon-mist);"><input type="checkbox" id="setting-haptics"> Вибрация</label><br>
    <label style="color:var(--color-moon-mist);"><input type="checkbox" id="setting-protection"> Защита от случайных касаний</label><br>
    <button class="action-btn" id="btn-reset-stats">🗑 Сбросить статистику</button>
  </div>
</div>

<div class="modal-overlay" id="modal-win">
  <div class="modal">
    <h2>🎉 Пазл решён!</h2>
    <div id="win-stats"></div>
    <div class="action-row">
      <button class="action-btn primary" id="btn-next">Следующий</button>
      <button class="action-btn" id="btn-restart">Заново</button>
      <button class="action-btn" id="btn-menu-win">В меню</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-generate">
  <div class="modal">
    <button class="modal-close" data-close="modal-generate">×</button>
    <h2>Генератор уровней</h2>
    <canvas id="gen-preview" width="300" height="300" style="background:rgba(199,211,234,0.06); border-radius:8px; display:block; margin:0 auto;"></canvas>
    <div class="action-row">
      <button class="action-btn primary" id="gen-play">Играть</button>
      <button class="action-btn" id="gen-regenerate">Сгенерировать другую</button>
      <button class="action-btn" id="gen-save">Сохранить в пазлы</button>
    </div>
  </div>
</div>

<script>
  (function() {
    'use strict';

    // ===================== PUZZLE_DATA =====================
    const PUZZLES = [
      { name: "Сердечко", size: 5, difficulty: 1, category: "Символы", rows: ["01100","11110","11110","01110","00100"] },
      { name: "Крестик", size: 5, difficulty: 1, category: "Символы", rows: ["10001","01010","00100","01010","10001"] },
      { name: "Стрелка вверх", size: 5, difficulty: 1, category: "Символы", rows: ["00100","01110","00100","00100","00100"] },
      { name: "Котик (мордочка)", size: 10, difficulty: 2, category: "Животные", rows: ["0000000000","0100100100","0100100100","0000000000","0111111110","0100000010","0101111010","0100000010","0011111100","0000000000"] },
      { name: "Цветок", size: 10, difficulty: 2, category: "Природа", rows: ["0011001100","0111111110","1111111111","0111111110","0011111100","0001111000","0000110000","0000110000","0000110000","0001111000"] },
      { name: "Звезда", size: 10, difficulty: 2, category: "Символы", rows: ["0000110000","0000110000","1111111111","0011111100","0011111100","0111111110","1100110011","0011001100","0010000100","0100000010"] },
      { name: "Чашка кофе", size: 10, difficulty: 2, category: "Предметы", rows: ["0000000000","0111111100","0110001100","0110001100","0111111100","0011111000","0001110000","0001110000","0001110000","0011111000"] },

    // ===================== GAME STATE =====================
    class GameState {
      constructor(rows) {
        this.rows = rows.map(r => r.split('').map(Number));
        this.size = this.rows.length;
        this.grid = Array(this.size).fill().map(() => Array(this.size).fill(0));
        this.memoGrid = Array(this.size).fill().map(() => Array(this.size).fill(0));
        this.fractionGrid = Array(this.size).fill().map(() => Array(this.size).fill(false));
        this.hintCells = new Set();
        this.solvedLines = { rows: new Set(), cols: new Set() };
        this.errors = 0;
        this.hintsLeft = 3;
        this.history = [];
        this.redoStack = [];
        this.startTime = Date.now();
        this.timerInterval = null;
        this.solved = false;
      }
      
      getCell(r, c) { 
        return this.grid[r][c]; 
      }
      
      getMemo(r, c) { 
        return this.memoGrid[r][c]; 
      }
      
      getFraction(r, c) { 
        return this.fractionGrid[r][c]; 
      }
      
      setCell(r, c, val, record = true) {
        if (record) {
          this.history.push({
            r, c, 
            prev: this.grid[r][c], 
            next: val,
            prevMemo: this.memoGrid[r][c],
            nextMemo: this.memoGrid[r][c],
            prevFraction: this.fractionGrid[r][c],
            nextFraction: this.fractionGrid[r][c]
          });
          if (this.history.length > 200) this.history.shift();
          this.redoStack = [];
        }
        this.grid[r][c] = val;
        
        if (val === 1) {
          const hintKey = `${r},${c}`;
          if (this.hintCells.has(hintKey)) {
            this.hintCells.delete(hintKey);
          }
        }
        
        this.autoFillLine(r, c);
        this.checkSolvedLines();
      }
      
      setMemo(r, c, val, record = true) {
        if (record) {
          this.history.push({
            r, c, 
            prev: this.grid[r][c], 
            next: this.grid[r][c],
            prevMemo: this.memoGrid[r][c],
            nextMemo: val,
            prevFraction: this.fractionGrid[r][c],
            nextFraction: this.fractionGrid[r][c]
          });
          if (this.history.length > 200) this.history.shift();
          this.redoStack = [];
        }
        this.memoGrid[r][c] = val;
      }
      
      setFraction(r, c, val, record = true) {
        if (record) {
          this.history.push({
            r, c, 
            prev: this.grid[r][c], 
            next: this.grid[r][c],
            prevMemo: this.memoGrid[r][c],
            nextMemo: this.memoGrid[r][c],
            prevFraction: this.fractionGrid[r][c],
            nextFraction: val
          });
          if (this.history.length > 200) this.history.shift();
          this.redoStack = [];
        }
        this.fractionGrid[r][c] = val;
      }
      
      clearAllMemos() {
        for (let r = 0; r < this.size; r++) {
          for (let c = 0; c < this.size; c++) {
            if (this.memoGrid[r][c] > 0) {
              this.memoGrid[r][c] = 0;
            }
            if (this.fractionGrid[r][c]) {
              this.fractionGrid[r][c] = false;
            }
          }
        }
      }
      
      hasMemos() {
        for (let r = 0; r < this.size; r++) {
          for (let c = 0; c < this.size; c++) {
            if (this.memoGrid[r][c] > 0 || this.fractionGrid[r][c]) return true;
          }
        }
        return false;
      }
      
      addHint(r, c) {
        this.hintCells.add(`${r},${c}`);
      }
      
      hasHint(r, c) {
        return this.hintCells.has(`${r},${c}`);
      }
      
      checkSolvedLines() {
        // Проверяем строки
        for (let r = 0; r < this.size; r++) {
          const rowHints = this.getLineHints(this.rows[r]);
          const rowFilled = this.grid[r].filter(v => v === 1).length;
          const rowTarget = rowHints.reduce((a, b) => a + b, 0);
          
          if (rowFilled === rowTarget) {
            this.solvedLines.rows.add(r);
          } else {
            this.solvedLines.rows.delete(r);
          }
        }
        
        // Проверяем столбцы
        for (let c = 0; c < this.size; c++) {
          const colVals = [];
          for (let r = 0; r < this.size; r++) {
            colVals.push(this.rows[r][c]);
          }
          const colHints = this.getLineHints(colVals);
          const colFilled = this.grid.filter(row => row[c] === 1).length;
          const colTarget = colHints.reduce((a, b) => a + b, 0);
          
          if (colFilled === colTarget) {
            this.solvedLines.cols.add(c);
          } else {
            this.solvedLines.cols.delete(c);
          }
        }
      }
      
      autoFillLine(r, c) {
        const rowHints = this.getLineHints(this.rows[r]);
        const rowFilled = this.grid[r].filter(v => v === 1).length;
        const rowTarget = rowHints.reduce((a, b) => a + b, 0);
        
        if (rowFilled === rowTarget) {
          for (let i = 0; i < this.size; i++) {
            if (this.grid[r][i] === 0) {
              this.grid[r][i] = 2;
            }
          }
        }
        
        const colVals = [];
        for (let i = 0; i < this.size; i++) {
          colVals.push(this.rows[i][c]);
        }
        const colHints = this.getLineHints(colVals);
        const colFilled = this.grid.filter(row => row[c] === 1).length;
        const colTarget = colHints.reduce((a, b) => a + b, 0);
        
        if (colFilled === colTarget) {
          for (let i = 0; i < this.size; i++) {
            if (this.grid[i][c] === 0) {
              this.grid[i][c] = 2;
            }
          }
        }
      }
      
      getLineHints(line) {
        const hints = [];
        let count = 0;
        line.forEach(v => {
          if (v === 1) count++;
          else {
            if (count > 0) hints.push(count);
            count = 0;
          }
        });
        if (count > 0) hints.push(count);
        return hints.length ? hints : [0];
      }
      
      undo() { 
        if (this.history.length) { 
          const last = this.history.pop(); 
          this.grid[last.r][last.c] = last.prev; 
          this.memoGrid[last.r][last.c] = last.prevMemo;
          this.fractionGrid[last.r][last.c] = last.prevFraction;
          this.redoStack.push(last);
          this.checkSolvedLines();
          return true; 
        } 
        return false; 
      }
      
      redo() { 
        if (this.redoStack.length) { 
          const last = this.redoStack.pop(); 
          this.grid[last.r][last.c] = last.next; 
          this.memoGrid[last.r][last.c] = last.nextMemo;
          this.fractionGrid[last.r][last.c] = last.nextFraction;
          this.history.push(last);
          this.checkSolvedLines();
          return true; 
        } 
        return false; 
      }
      
      isSolved() { 
        for (let r = 0; r < this.size; r++) 
          for (let c = 0; c < this.size; c++) 
            if (this.grid[r][c] !== this.rows[r][c]) return false; 
        return true; 
      }
    }

    // ===================== RENDERER =====================
    class Renderer {
      constructor(canvas) {
        this.canvas = canvas; 
        this.ctx = canvas.getContext('2d');
        this.zoom = 1; 
        this.offsetX = 0; 
        this.offsetY = 0;
        this.cellSize = 30; 
        this.state = null;
        this.animations = [];
      }
      
      setState(state) { 
        this.state = state; 
        this.computeSizes(); 
        this.fitBoard(); 
        this.draw(); 
      }
      
      computeSizes() {
        const wrap = document.getElementById('canvas-wrap');
        const w = wrap.clientWidth - 20;
        const h = wrap.clientHeight - 20;
        const size = this.state.size;
        const hintSpace = 80;
        const availableW = w - hintSpace;
        const availableH = h - hintSpace;
        this.cellSize = Math.min(availableW / size, availableH / size);
        this.cellSize = Math.max(10, Math.min(40, this.cellSize));
        this.canvas.width = w;
        this.canvas.height = h;
      }
      
      fitBoard() {
        const size = this.state.size;
        const boardW = size * this.cellSize;
        const boardH = size * this.cellSize;
        this.offsetX = (this.canvas.width - boardW) / 2 + 40;
        this.offsetY = (this.canvas.height - boardH) / 2 + 40;
        this.zoom = 1;
      }
      
      screenToCell(x, y) {
        const r = Math.floor((y - this.offsetY) / (this.cellSize * this.zoom));
        const c = Math.floor((x - this.offsetX) / (this.cellSize * this.zoom));
        return {r, c};
      }
      
      animateCellFill(r, c) {
        const cell = this.cellSize * this.zoom;
        const x = c * cell + this.offsetX;
        const y = r * cell + this.offsetY;
        
        this.animations.push({
          type: 'fill',
          r, c,
          x, y,
          cell,
          startTime: performance.now(),
          duration: 200
        });
        
        if (!this.animationRunning) {
          this.animationRunning = true;
          this.runAnimations();
        }
      }
      
      runAnimations() {
        const now = performance.now();
        let hasActiveAnimations = false;
        
        this.animations = this.animations.filter(anim => {
          const progress = Math.min(1, (now - anim.startTime) / anim.duration);
          
          if (progress < 1) {
            hasActiveAnimations = true;
          }
          
          if (anim.type === 'fill') {
            const scale = 0.5 + (progress * 0.5);
            this.ctx.fillStyle = '#000000';
            this.ctx.fillRect(
              anim.x + (anim.cell - anim.cell * scale) / 2,
              anim.y + (anim.cell - anim.cell * scale) / 2,
              anim.cell * scale,
              anim.cell * scale
            );
          }
          
          return progress < 1;
        });
        
        if (hasActiveAnimations) {
          requestAnimationFrame(() => this.runAnimations());
        } else {
          this.animationRunning = false;
          this.draw();
        }
      }
      
      draw() {
        const ctx = this.ctx; 
        const w = this.canvas.width, h = this.canvas.height;
        ctx.clearRect(0, 0, w, h);
        if (!this.state) return;
        
        const cell = this.cellSize * this.zoom;
        const size = this.state.size;
        
        ctx.fillStyle = 'rgba(186, 214, 247, 0.03)';
        ctx.fillRect(0, 0, w, h);
        
        this.drawHints(ctx, cell, size);
        
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const x = c * cell + this.offsetX;
            const y = r * cell + this.offsetY;
            
            if (x + cell < 0 || x > w || y + cell < 0 || y > h) continue;
            
            const val = this.state.grid[r][c];
            const memoVal = this.state.memoGrid[r][c];
            const fractionVal = this.state.fractionGrid[r][c];
            const hasHint = this.state.hasHint(r, c);
            const rowSolved = this.state.solvedLines.rows.has(r);
            const colSolved = this.state.solvedLines.cols.has(c);
            
            // Фон клетки
            ctx.fillStyle = 'rgba(199, 211, 234, 0.06)';
            ctx.fillRect(x, y, cell, cell);
            
            // Подсветка решённых линий
            if (rowSolved || colSolved) {
              ctx.fillStyle = 'rgba(38, 150, 132, 0.15)';
              ctx.fillRect(x, y, cell, cell);
            }
            
            // Подсказка - яркий голубой фон
            if (hasHint) {
              ctx.fillStyle = 'rgba(0, 200, 255, 0.7)';
              ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
            }
            
            if (val === 1) {
              ctx.fillStyle = '#000000';
              ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
            } else if (val === 2) {
              ctx.strokeStyle = '#9da7ba';
              ctx.lineWidth = Math.max(1, cell / 6);
              ctx.beginPath(); 
              ctx.moveTo(x + cell * 0.2, y + cell * 0.2); 
              ctx.lineTo(x + cell * 0.8, y + cell * 0.8); 
              ctx.stroke();
              ctx.beginPath(); 
              ctx.moveTo(x + cell * 0.8, y + cell * 0.2); 
              ctx.lineTo(x + cell * 0.2, y + cell * 0.8); 
              ctx.stroke();
            }
            
            if (memoVal === 1) {
              ctx.fillStyle = '#ff0000';
              ctx.beginPath();
              ctx.moveTo(x + cell * 0.5, y + cell * 0.1);
              ctx.lineTo(x + cell * 0.1, y + cell * 0.9);
              ctx.lineTo(x + cell * 0.9, y + cell * 0.9);
              ctx.closePath();
              ctx.fill();
            }
            
            if (fractionVal) {
              ctx.fillStyle = '#ff8c00';
              ctx.beginPath();
              ctx.arc(x + cell * 0.5, y + cell * 0.5, cell * 0.35, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(x + cell * 0.45, y + cell * 0.3, cell * 0.1, cell * 0.4);
              ctx.fillRect(x + cell * 0.3, y + cell * 0.45, cell * 0.4, cell * 0.1);
            }
            
            if (cell > 6) {
              ctx.strokeStyle = 'rgba(182, 217, 252, 0.3)';
              ctx.lineWidth = 0.5;
              ctx.strokeRect(x + 0.5, y + 0.5, cell - 1, cell - 1);
            }
            
            if ((r + 1) % 5 === 0 || (c + 1) % 5 === 0) {
              ctx.strokeStyle = '#027dea';
              ctx.lineWidth = 2;
              if ((c + 1) % 5 === 0) {
                ctx.beginPath();
                ctx.moveTo(x + cell, y);
                ctx.lineTo(x + cell, y + cell);
                ctx.stroke();
              }
              if ((r + 1) % 5 === 0) {
                ctx.beginPath();
                ctx.moveTo(x, y + cell);
                ctx.lineTo(x + cell, y + cell);
                ctx.stroke();
              }
            }
          }
        }
        
        ctx.strokeStyle = '#027dea';
        ctx.lineWidth = 3;
        ctx.strokeRect(
          this.offsetX, 
          this.offsetY, 
          size * cell, 
          size * cell
        );
        
        if (this.errorCells) {
          this.errorCells.forEach(([r,c]) => {
            const x = c * cell + this.offsetX, y = r * cell + this.offsetY;
            ctx.fillStyle = 'rgba(255,0,0,0.35)'; 
            ctx.fillRect(x, y, cell, cell);
          });
        }
      }
      
      drawHints(ctx, cell, size) {
        ctx.fillStyle = '#d1e4fa';
        ctx.font = `${Math.max(8, cell * 0.6)}px 'Inter', system-ui`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        for (let r = 0; r < size; r++) {
          const hints = this.state.getLineHints(this.state.rows[r]);
          let x = this.offsetX - 10;
          let y = r * cell + this.offsetY + cell / 2;
          
          // Подсветка решённых строк
          if (this.state.solvedLines.rows.has(r)) {
            ctx.fillStyle = 'rgba(157, 167, 186, 0.5)';
          } else {
            ctx.fillStyle = '#d1e4fa';
          }
          
          hints.forEach(hint => {
            ctx.fillText(hint, x, y);
            x -= cell * 0.7;
          });
        }
        
        for (let c = 0; c < size; c++) {
          const colVals = [];
          for (let r = 0; r < size; r++) colVals.push(this.state.rows[r][c]);
          const hints = this.state.getLineHints(colVals);
          let y = this.offsetY - 10;
          let x = c * cell + this.offsetX + cell / 2;
          
          // Подсветка решённых столбцов
          if (this.state.solvedLines.cols.has(c)) {
            ctx.fillStyle = 'rgba(157, 167, 186, 0.5)';
          } else {
            ctx.fillStyle = '#d1e4fa';
          }
          
          hints.forEach(hint => {
            ctx.fillText(hint, x, y);
            y -= cell * 0.7;
          });
        }
      }
    }

        this.canvas.addEventListener('dblclick', e => e.preventDefault());
        this.canvas.addEventListener('contextmenu', e => e.preventDefault());
      }
      
      setMode(mode) { 
        this.mode = mode; 
      }
      
      setProtection(enabled) {
        this.protectionEnabled = enabled;
      }
      
      onPointerDown(e) {
        e.preventDefault();
        this.pointerDown = true;
        this.hasMoved = false;
        this.isDrawing = false;
        this.drawnCells.clear();
        this.startX = e.clientX; 
        this.startY = e.clientY;
        this.startTime = Date.now();
        
        const rect = this.canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
        this.lastCell = this.renderer.screenToCell(x, y);
      }
      
      onPointerMove(e) {
        if (!this.pointerDown) return;
        e.preventDefault();
        
        const dx = e.clientX - this.startX;
        const dy = e.clientY - this.startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
          this.hasMoved = true;
          this.isDrawing = true;
        }
        
        if (this.isDrawing) {
          const rect = this.canvas.getBoundingClientRect();
          const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
          const y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
          const cell = this.renderer.screenToCell(x, y);
          
          if (cell && cell.r >= 0 && cell.c >= 0 && cell.r < this.game.size && cell.c < this.game.size) {
            if (this.lastCell) {
              const sameRow = cell.r === this.lastCell.r;
              const sameCol = cell.c === this.lastCell.c;
              
              if (!sameRow && !sameCol) {
                return;
              }
            }
            
            const cellKey = `${cell.r},${cell.c}`;
            if (!this.drawnCells.has(cellKey)) {
              this.drawnCells.add(cellKey);
              this.applyAction(cell.r, cell.c);
            }
            this.lastCell = cell;
          }
        }
      }
      
      onPointerUp(e) {
        e.preventDefault();
        
        if (!this.hasMoved && this.pointerDown) {
          const elapsed = Date.now() - this.startTime;
          const rect = this.canvas.getBoundingClientRect();
          const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
          const y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
          const cell = this.renderer.screenToCell(x, y);
          
          if (cell && cell.r >= 0 && cell.c >= 0 && cell.r < this.game.size && cell.c < this.game.size) {
            if (!this.protectionEnabled || elapsed > 150) {
              this.applyAction(cell.r, cell.c);
            }
          }
        }
        
        this.pointerDown = false;
        this.isDrawing = false;
        this.hasMoved = false;
        this.lastCell = null;
        this.drawnCells.clear();
      }
      
      applyAction(r, c) {
        if (this.game.solved) return;
        
        if (this.mode === 'paint') {
          const cur = this.game.getCell(r, c);
          const newVal = cur === 1 ? 0 : 1;
          this.game.setCell(r, c, newVal);
          this.renderer.animateCellFill(r, c);
          Haptics.tap(); 
          SoundManager.tap();
          
          if (newVal === 1 && this.game.rows[r][c] !== 1) { 
            this.game.errors++; 
            this.cb.onError(r, c); 
          } else {
            this.cb.onUpdate();
          }
          
          if (this.game.isSolved()) this.cb.onWin();
        } else if (this.mode === 'x') {
          const cur = this.game.getCell(r, c);
          const newVal = cur === 2 ? 0 : 2;
          this.game.setCell(r, c, newVal);
          Haptics.mode(); 
          SoundManager.mode();
          this.cb.onUpdate();
        } else if (this.mode === 'memo') {
          const cur = this.game.getMemo(r, c);
          const newVal = cur > 0 ? 0 : 1;
          this.game.setMemo(r, c, newVal);
          Haptics.mode(); 
          SoundManager.mode();
          this.cb.onUpdate();
          this.cb.onMemoChange();
        } else if (this.mode === 'memo-fraction') {
          const cur = this.game.getFraction(r, c);
          this.game.setFraction(r, c, !cur);
          Haptics.mode(); 
          SoundManager.mode();
          this.cb.onUpdate();
          this.cb.onMemoChange();
        }
        
        this.renderer.draw();
      }
    }

    // ===================== LEVEL GENERATOR =====================
    const LevelGenerator = {
      generate(size = 20) {
        let grid = Array(size).fill().map(() => Array(size).fill(0));
        const primitives = ['circle', 'semicircle', 'hline', 'vline', 'dline', 'corner', 'stripe', 'diamond', 'triangle'];
        const count = 2 + Math.floor(Math.random() * 3);
        
        for (let i = 0; i < count; i++) {
          const type = primitives[Math.floor(Math.random() * primitives.length)];
          const x = Math.floor(Math.random() * size);
          const y = Math.floor(Math.random() * size);
          const radius = 3 + Math.floor(Math.random() * Math.max(2, size / 4));
          this.drawPrimitive(grid, type, x, y, radius);
        }
        
        if (Math.random() < 0.7) {
          const sym = ['v', 'h', 'both'][Math.floor(Math.random() * 3)];
          this.applySymmetry(grid, sym);
        }
        
        this.smooth(grid);
        this.validate(grid);
        return grid;
      },
      
      drawPrimitive(grid, type, cx, cy, r) {
        const size = grid.length;
        for (let i = 0; i < size; i++) {
          for (let j = 0; j < size; j++) {
            const dx = i - cx, dy = j - cy;
            let val = false;
            switch(type) {
              case 'circle': val = dx*dx + dy*dy <= r*r; break;
              case 'semicircle': val = dx*dx + dy*dy <= r*r && dx > 0; break;
              case 'hline': val = Math.abs(dx) <= r && Math.abs(dy) <= 1; break;
              case 'vline': val = Math.abs(dy) <= r && Math.abs(dx) <= 1; break;
              case 'dline': val = Math.abs(dx-dy) <= 1 && Math.abs(dx+dy) <= r; break;
              case 'corner': val = (Math.abs(dx)<=r && Math.abs(dy)<=1) || (Math.abs(dy)<=r && Math.abs(dx)<=1); break;
              case 'stripe': val = Math.abs(dx) <= r && Math.abs(dy) <= 2 && (i+j)%2===0; break;
              case 'diamond': val = Math.abs(dx)+Math.abs(dy) <= r; break;
              case 'triangle': val = dy >= 0 && Math.abs(dx)+dy <= r; break;
            }
            if (val) grid[i][j] = 1;
          }
        }
      },
      
      applySymmetry(grid, sym) {
        const size = grid.length;
        const copy = grid.map(r => [...r]);
        if (sym === 'v') for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) grid[i][size-1-j] = copy[i][j] || grid[i][size-1-j];
        if (sym === 'h') for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) grid[size-1-i][j] = copy[i][j] || grid[size-1-i][j];
        if (sym === 'both') for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) grid[size-1-i][size-1-j] = copy[i][j] || grid[size-1-i][size-1-j];
      },
      
      smooth(grid) {
        const size = grid.length;
        for (let pass = 0; pass < 2; pass++) {
          const copy = grid.map(r => [...r]);
          for (let i = 1; i < size-1; i++) {
            for (let j = 1; j < size-1; j++) {
              let sum = 0;
              for (let di = -1; di <= 1; di++) 
                for (let dj = -1; dj <= 1; dj++) 
                  sum += copy[i+di][j+dj];
              if (sum < 3) grid[i][j] = 0;
              else if (sum > 6) grid[i][j] = 1;
            }
          }
        }
        for (let i = 1; i < size-1; i++) {
          for (let j = 1; j < size-1; j++) {
            if (grid[i][j] && !grid[i-1][j] && !grid[i+1][j] && !grid[i][j-1] && !grid[i][j+1]) {
              grid[i][j] = 0;
            }
          }
        }
      },
      
      validate(grid) {
        const size = grid.length;
        let filled = 0;
        grid.forEach(r => r.forEach(v => filled += v));
        const ratio = filled / (size * size);
        return ratio >= 0.2 && ratio <= 0.6;
      }
    };

    // ===================== EDITOR =====================
    class Editor {
      constructor() {
        this.size = 10; 
        this.grid = Array(this.size).fill().map(() => Array(this.size).fill(0));
        this.tool = 'pencil'; 
        this.symmetry = 'none';
        this.canvas = document.getElementById('editor-canvas'); 
        this.ctx = this.canvas.getContext('2d');
        this.preview = document.getElementById('editor-preview'); 
        this.previewCtx = this.preview.getContext('2d');
        this.setupEvents();
      }
      
      setSize(s) { 
        this.size = s; 
        this.grid = Array(s).fill().map(() => Array(s).fill(0)); 
        this.render(); 
      }
      
      setupEvents() {
        this.canvas.addEventListener('pointerdown', e => { 
          const rect = this.canvas.getBoundingClientRect();
          const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
          const y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
          this.paint(x, y); 
        });
        
        this.canvas.addEventListener('pointermove', e => { 
          if (e.buttons) {
            const rect = this.canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
            this.paint(x, y); 
          }
        });
      }
      
      paint(x, y) {
        const cell = this.canvas.width / this.size;
        const r = Math.floor(y / cell), c = Math.floor(x / cell);
        if (r < 0 || c < 0 || r >= this.size || c >= this.size) return;
        this.applyTool(r, c);
        this.render();
      }
      
      applyTool(r, c) {
        if (this.tool === 'pencil') this.grid[r][c] = 1;
        else if (this.tool === 'eraser') this.grid[r][c] = 0;
        else if (this.tool === 'fill') this.floodFill(r, c, this.grid[r][c] ? 0 : 1);
        
        if (this.symmetry !== 'none') this.applySymmetry();
      }
      
      applySymmetry() {
        const s = this.size; 
        const g = this.grid.map(r => [...r]);
        if (this.symmetry === 'v' || this.symmetry === 'both') 
          for (let i = 0; i < s; i++) 
            for (let j = 0; j < s; j++) 
              this.grid[i][s-1-j] = g[i][j];
        if (this.symmetry === 'h' || this.symmetry === 'both') 
          for (let i = 0; i < s; i++) 
            for (let j = 0; j < s; j++) 
              this.grid[s-1-i][j] = g[i][j];
      }
      
      floodFill(r, c, val) {
        const old = this.grid[r][c]; 
        if (old === val) return;
        const q = [[r, c]];
        while (q.length) {
          const [x, y] = q.pop();
          if (x < 0 || y < 0 || x >= this.size || y >= this.size) continue;
          if (this.grid[x][y] !== old) continue;
          this.grid[x][y] = val; 
          q.push([x-1,y], [x+1,y], [x,y-1], [x,y+1]);
        }
      }
      
      render() {
        const cell = this.canvas.width / this.size;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        for (let r = 0; r < this.size; r++) {
          for (let c = 0; c < this.size; c++) {
            this.ctx.fillStyle = this.grid[r][c] ? '#000000' : 'rgba(199, 211, 234, 0.06)';
            this.ctx.fillRect(c * cell, r * cell, cell, cell);
            this.ctx.strokeStyle = 'rgba(182, 217, 252, 0.3)'; 
            this.ctx.strokeRect(c * cell, r * cell, cell, cell);
          }
        }
        
        const pcell = this.preview.width / this.size;
        this.previewCtx.clearRect(0, 0, this.preview.width, this.preview.height);
        for (let r = 0; r < this.size; r++) {
          for (let c = 0; c < this.size; c++) {
            this.previewCtx.fillStyle = this.grid[r][c] ? '#000000' : 'rgba(199, 211, 234, 0.06)';
            this.previewCtx.fillRect(c * pcell, r * pcell, pcell, pcell);
          }
        }
      }
      
      exportJSON() {
        const data = { name: 'Мой пазл', size: this.size, rows: this.grid.map(r => r.join('')) };
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a'); 
        a.href = URL.createObjectURL(blob); 
        a.download = 'puzzle.json'; 
        a.click();
      }
      
      importJSON(file) {
        const reader = new FileReader();
        reader.onload = e => {
          try {
            const data = JSON.parse(e.target.result);
            this.size = data.size; 
            this.grid = data.rows.map(r => r.split('').map(Number));
            this.render();
          } catch(err) { 
            alert('Ошибка импорта'); 
          }
        };
        reader.readAsText(file);
      }
    }

      updateMemoButton() {
        const btn = document.getElementById('btn-clear-memo');
        if (this.game && this.game.hasMemos()) {
          btn.style.display = 'flex';
        } else {
          btn.style.display = 'none';
        }
      },
      
      loadPuzzle(puzzle) {
        if (!puzzle) return;
        this.game = new GameState(puzzle.rows);
        this.game.puzzleName = puzzle.name;
        this.renderer.setState(this.game);
        
        this.inputHandler = new InputHandler(this.renderer, this.game, {
          onUpdate: () => {
            this.renderer.draw();
            this.updateMemoButton();
          },
          onError: (r, c) => { 
            this.renderer.errorCells = [[r, c]]; 
            setTimeout(() => {
              this.renderer.errorCells = null; 
              this.renderer.draw();
            }, 300); 
            Haptics.error(); 
            SoundManager.error(); 
          },
          onWin: () => this.winGame(),
          onMemoChange: () => this.updateMemoButton()
        });
        
        const protectionEnabled = Storage.get('settings', {}).protection || false;
        this.inputHandler.setProtection(protectionEnabled);
        
        this.renderer.draw();
        this.updateTitle();
        this.startTimer();
        this.updateStats();
        this.updateMemoButton();
      },
      
      winGame() {
        this.game.solved = true;
        SoundManager.win(); 
        Haptics.win();
        
        // Вычисляем звёзды
        const timeSeconds = (Date.now() - this.game.startTime) / 1000;
        const stars = this.calculateStars(timeSeconds, this.game.errors, this.game.size);
        
        this.showModal('modal-win');
        document.getElementById('win-stats').innerHTML = 
          `Время: ${this.formatTime(Date.now() - this.game.startTime)}<br>` +
          `Ошибки: ${this.game.errors}<br>` +
          `Размер: ${this.game.size}x${this.game.size}<br>` +
          `Звёзды: ${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}`;
        
        // Сохраняем статистику
        const stats = Storage.get('stats', {});
        const key = this.game.puzzleName;
        const prevStars = stats[key]?.stars || 0;
        const newStars = Math.max(prevStars, stars);
        
        stats[key] = { 
          solved: true, 
          bestTime: Math.min(stats[key]?.bestTime || Infinity, Date.now() - this.game.startTime),
          errors: this.game.errors,
          stars: newStars
        };
        Storage.set('stats', stats);
      },
      
      calculateStars(timeSeconds, errors, size) {
        const baseTime = size * 2; // базовое время в секундах
        const timeBonus = Math.max(0, 1 - (timeSeconds - baseTime) / baseTime);
        const errorPenalty = errors * 0.1;
        
        const score = timeBonus - errorPenalty;
        
        if (score > 0.8) return 3;
        if (score > 0.5) return 2;
        if (score > 0.2) return 1;
        return 0;
      },
      
      showDaily() {
        const today = new Date().toDateString();
        let dailyData = Storage.get('daily', {});
        
        if (dailyData.date !== today) {
          // Выбираем случайный пазл для сегодня
          const puzzle = PUZZLES[Math.floor(Math.random() * PUZZLES.length)];
          dailyData = {
            date: today,
            puzzle: puzzle,
            solved: false
          };
          Storage.set('daily', dailyData);
        }
        
        this.dailyPuzzle = dailyData.puzzle;
        
        const info = document.getElementById('daily-info');
        const stats = Storage.get('stats', {})[dailyData.puzzle.name];
        
        info.innerHTML = `
          <p style="margin-bottom: 12px;">Пазл: <strong>${dailyData.puzzle.name}</strong></p>
          <p style="margin-bottom: 12px;">Размер: ${dailyData.puzzle.size}x${dailyData.puzzle.size}</p>
          ${stats?.solved ? '<p style="color: #269684;">✅ Уже решён сегодня</p>' : '<p>Ещё не решён</p>'}
        `;
        
        this.showModal('modal-daily');
      },
      
      showStats() {
        const stats = Storage.get('stats', {});
        const solvedCount = Object.values(stats).filter(s => s.solved).length;
        const totalCount = PUZZLES.length;
        
        document.getElementById('stat-solved').textContent = solvedCount;
        document.getElementById('stat-total').textContent = totalCount;
        
        // Лучшее время
        const bestTime = Math.min(...Object.values(stats).map(s => s.bestTime || Infinity));
        if (bestTime !== Infinity) {
          document.getElementById('stat-best-time').textContent = this.formatTime(bestTime);
        } else {
          document.getElementById('stat-best-time').textContent = '--:--';
        }
        
        // Среднее количество ошибок
        const errorsList = Object.values(stats).map(s => s.errors || 0);
        const avgErrors = errorsList.length ? Math.round(errorsList.reduce((a, b) => a + b, 0) / errorsList.length) : 0;
        document.getElementById('stat-avg-errors').textContent = avgErrors;
        
        this.showModal('modal-stats');
      },
      
      showLevels() {
        const container = document.getElementById('levels-list');
        container.innerHTML = '';
        
        // Группировка по категориям
        const categories = {};
        PUZZLES.forEach(p => { 
          if (!categories[p.category]) categories[p.category] = []; 
          categories[p.category].push(p); 
        });
        
        Object.keys(categories).forEach(category => {
          const div = document.createElement('div'); 
          div.className = 'level-group';
          div.innerHTML = `<h3>${category}</h3>`;
          const cards = document.createElement('div'); 
          cards.className = 'cards';
          
          categories[category].forEach(p => {
            const card = document.createElement('div'); 
            card.className = 'level-card';
            const stats = Storage.get('stats', {})[p.name];
            if (stats?.solved) card.classList.add('solved');
            
            const miniCanvas = document.createElement('canvas'); 
            miniCanvas.width = 100; 
            miniCanvas.height = 100;
            const ctx = miniCanvas.getContext('2d'); 
            const cell = 100 / p.size;
            p.rows.forEach((row, r) => 
              row.split('').forEach((v, c) => { 
                ctx.fillStyle = v === '1' ? '#000000' : 'rgba(199, 211, 234, 0.06)'; 
                ctx.fillRect(c * cell, r * cell, cell, cell); 
              })
            );
            
            card.appendChild(miniCanvas);
            
            const starsHtml = stats?.stars ? 
              `<div class="stars">${'★'.repeat(stats.stars)}${'☆'.repeat(3 - stats.stars)}</div>` : '';
            
            card.innerHTML += 
              `<div class="name">${p.name}</div>` +
              `<div class="meta">${p.size}x${p.size} ${stats?.solved ? '✅' : ''}</div>` +
              starsHtml;
            
            card.onclick = () => { 
              this.hideModal('modal-levels'); 
              this.loadPuzzle(p); 
            };
            card.onmouseenter = () => this.showPreview(p);
            card.onmouseleave = () => this.hidePreview();
            
            cards.appendChild(card);
          });
          
          div.appendChild(cards); 
          container.appendChild(div);
        });
        
        const custom = Storage.get('customPuzzles', []);
        if (custom.length) {
          const div = document.createElement('div'); 
          div.className = 'level-group';
          div.innerHTML = '<h3>Мои пазлы</h3>';
          const cards = document.createElement('div'); 
          cards.className = 'cards';
          
          custom.forEach(p => {
            const card = document.createElement('div'); 
            card.className = 'level-card';
            const miniCanvas = document.createElement('canvas'); 
            miniCanvas.width = 100; 
            miniCanvas.height = 100;
            const ctx = miniCanvas.getContext('2d'); 
            const cell = 100 / p.size;
            p.rows.forEach((row, r) => 
              row.split('').forEach((v, c) => { 
                ctx.fillStyle = v === '1' ? '#000000' : 'rgba(199, 211, 234, 0.06)'; 
                ctx.fillRect(c * cell, r * cell, cell, cell); 
              })
            );
            card.appendChild(miniCanvas); 
            card.innerHTML += 
              `<div class="name">${p.name}</div>` +
              `<div class="meta">${p.size}x${p.size}</div>`;
            card.onclick = () => { 
              this.hideModal('modal-levels'); 
              this.loadPuzzle(p); 
            };
            card.onmouseenter = () => this.showPreview(p);
            card.onmouseleave = () => this.hidePreview();
            cards.appendChild(card);
          });
          
          div.appendChild(cards); 
          container.appendChild(div);
        }
      },
      
      showPreview(puzzle) {
        const container = document.getElementById('preview-container');
        const canvas = document.getElementById('preview-canvas');
        container.style.display = 'block';
        
        const size = puzzle.size;
        const maxPreviewSize = 300;
        const cellSize = Math.floor(maxPreviewSize / size);
        canvas.width = size * cellSize;
        canvas.height = size * cellSize;
        
        const ctx = canvas.getContext('2d');
        puzzle.rows.forEach((row, r) => {
          row.split('').forEach((v, c) => {
            ctx.fillStyle = v === '1' ? '#000000' : 'rgba(199, 211, 234, 0.06)';
            ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
          });
        });
        
        container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      },
      
      hidePreview() {
        const container = document.getElementById('preview-container');
        container.style.display = 'none';
      },
      
      randomLevel() {
        const unsolved = PUZZLES.filter(p => !Storage.get('stats', {})[p.name]?.solved);
        const pool = unsolved.length ? unsolved : PUZZLES;
        const p = pool[Math.floor(Math.random() * pool.length)];
        this.hideModal('modal-levels'); 
        this.loadPuzzle(p);
      },
      
      saveEditorPuzzle() {
        const name = prompt('Название пазла:', 'Мой пазл');
        if (!name) return;
        const custom = Storage.get('customPuzzles', []);
        custom.push({
          name, 
          size: this.editor.size, 
          rows: this.editor.grid.map(r => r.join(''))
        });
        Storage.set('customPuzzles', custom);
        alert('Сохранено в "Мои пазлы"');
      },
      
      playEditorPuzzle() {
        const grid = this.editor.grid;
        const filled = grid.flat().reduce((a, b) => a + b, 0);
        if (filled < 3) { 
          alert('Слишком мало закрашенных клеток'); 
          return; 
        }
        const puzzle = {
          name: 'Мой пазл', 
          size: this.editor.size, 
          rows: grid.map(r => r.join(''))
        };
        this.hideModal('modal-editor'); 
        this.loadPuzzle(puzzle);
      },
      
      generateLevel() {
        const size = 20;
        let grid = LevelGenerator.generate(size);
        this.generatedPuzzle = { 
          name: 'Сгенерированный', 
          size, 
          rows: grid.map(r => r.join('')) 
        };
        
        const canvas = document.getElementById('gen-preview');
        const ctx = canvas.getContext('2d'); 
        canvas.width = 300; 
        canvas.height = 300;
        const cell = 300 / size;
        for (let r = 0; r < size; r++) 
          for (let c = 0; c < size; c++) { 
            ctx.fillStyle = grid[r][c] ? '#000000' : 'rgba(199, 211, 234, 0.06)'; 
            ctx.fillRect(c * cell, r * cell, cell, cell); 
          }
        
        this.showModal('modal-generate');
      },
      
      saveGenerated() {
        const custom = Storage.get('customPuzzles', []);
        custom.push(this.generatedPuzzle);
        Storage.set('customPuzzles', custom);
        alert('Сохранено');
      },
      
      nextLevel() {
        const idx = PUZZLES.findIndex(p => p.name === this.game.puzzleName);
        const next = PUZZLES[(idx + 1) % PUZZLES.length];
        this.hideModal('modal-win'); 
        this.loadPuzzle(next);
      },
      
      restartLevel() {
        this.hideModal('modal-win');
        const current = PUZZLES.find(p => p.name === this.game.puzzleName);
        this.loadPuzzle(current || this.game);
      },
      
      updateTitle() { 
        document.getElementById('puzzle-title').textContent = 
          `${this.game.puzzleName} ${this.game.size}x${this.game.size}`; 
      },
      
      formatTime(ms) { 
        const s = Math.floor(ms / 1000); 
        return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`; 
      },
      
      startTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => { 
          if (this.game && !this.game.solved) {
            document.getElementById('timer').textContent = 
              `⏱ ${this.formatTime(Date.now() - this.game.startTime)}`; 
          }
        }, 1000);
      },
      
      updateStats() { 
        document.getElementById('error-count').textContent = `✕ ${this.game.errors}`; 
      },
      
      undo() { 
        if (this.game.undo()) { 
          this.renderer.draw(); 
          this.updateMemoButton();
          SoundManager.mode(); 
        } 
      },
      
      redo() { 
        if (this.game.redo()) { 
          this.renderer.draw(); 
          this.updateMemoButton();
          SoundManager.mode(); 
        } 
      },
      
      giveHint() {
        if (!this.game) return;
        const unsolved = [];
        for (let r = 0; r < this.game.size; r++) 
          for (let c = 0; c < this.game.size; c++) 
            if (this.game.rows[r][c] === 1 && this.game.grid[r][c] !== 1 && !this.game.hasHint(r, c)) 
              unsolved.push([r, c]);
        
        if (unsolved.length) {
          const [r, c] = unsolved[Math.floor(Math.random() * unsolved.length)];
          this.game.addHint(r, c); 
          this.renderer.draw();
          Haptics.tap(); 
          SoundManager.tap();
        }
      }
    };

    // Запуск
    window.addEventListener('DOMContentLoaded', () => UI.init());
    window.addEventListener('resize', () => { 
      if (UI.renderer && UI.game) { 
        UI.renderer.computeSizes(); 
        UI.renderer.fitBoard(); 
        UI.renderer.draw(); 
      } 
    });
  })();
</script>
</body>
</html>
