<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Нонограммы">
  <title>Японские кроссворды — Коллекция</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2305060f'/%3E%3Cpath d='M20 80 Q50 20 80 80' fill='none' stroke='%23663af3' stroke-width='8'/%3E%3C/svg%3E">
  <style>
    :root {
      --color-midnight-canvas: #05060f;
      --color-steel-plate: #2f343e;
      --color-fog-veil: #9da7ba;
      --color-moon-mist: #c7d3ea;
      --color-frost-glow: #d1e4fa;
      --color-ice-highlight: #d8ecf8;
      --color-pure-white: #ffffff;
      --color-void-violet: #663af3;
      --color-blueprint-blue: #b6d9fc;
      --color-glass-edge: #bad7f71f;
      --color-luminous-fill: #c7d3ea1f;
      --shadow-sm: rgba(186, 207, 247, 0.32) 0px 0px 6px 0px;
      --shadow-md: rgba(238, 186, 247, 0.24) 0px 0px 12px 0px;
      --shadow-subtle: rgba(186, 215, 247, 0.12) 0px 0px 0px 1px inset;
      --shadow-subtle-6: rgba(216, 236, 248, 0.2) 0px 1px 1px 0px inset, rgba(168, 216, 245, 0.06) 0px 24px 48px 0px inset, rgba(0, 0, 0, 0.3) 0px 16px 32px 0px;
      --radius-cards: 16px;
      --radius-badges: 6px;
      --radius-inputs: 6px;
      --radius-modals: 16px;
      --radius-buttons: 999px;
      --radius-iconcontainers: 9999px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
      -webkit-touch-callout: none; 
    }
    
    html, body { 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      position: fixed; 
      overscroll-behavior: none; 
      background: var(--color-midnight-canvas); 
      color: var(--color-frost-glow); 
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; 
      transition: background 0.25s ease, color 0.25s ease; 
      touch-action: none;
    }
    
    body { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: space-between; 
      user-select: none; 
    }

    #app { 
      width: 100%; 
      height: 100%; 
      display: flex; 
      flex-direction: column; 
      max-width: 800px; 
      padding: 8px; 
      position: relative;
    }

    #top-bar { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      gap: 8px; 
      padding: 4px 0 8px; 
      flex-shrink: 0; 
    }
    
    .top-btn { 
      background: var(--color-luminous-fill); 
      border: none; 
      border-radius: var(--radius-buttons); 
      box-shadow: var(--shadow-subtle); 
      width: 44px; 
      height: 44px; 
      font-size: 20px; 
      cursor: pointer; 
      color: var(--color-frost-glow); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      transition: all 0.2s; 
      backdrop-filter: blur(10px);
    }
    
    .top-btn:active { 
      transform: scale(0.94); 
      background: var(--color-steel-plate); 
    }
    
    #puzzle-title { 
      font-weight: 500; 
      font-size: 16px; 
      text-align: center; 
      flex: 1; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      color: var(--color-ice-highlight);
      letter-spacing: -0.01em;
    }
    
    #stats { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      font-size: 14px; 
    }
    
    #error-count { 
      color: #e46d4c; 
      font-weight: 500; 
    }
    
    #timer { 
      font-variant-numeric: tabular-nums; 
      color: var(--color-moon-mist);
    }

    #canvas-wrap { 
      flex: 1; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden; 
      border-radius: var(--radius-cards); 
      background: rgba(186, 214, 247, 0.03); 
      box-shadow: var(--shadow-subtle-6); 
      margin-bottom: 8px; 
      touch-action: none; 
      min-height: 0;
      backdrop-filter: blur(10px);
    }
    
    canvas { 
      display: block; 
      touch-action: none; 
      border-radius: 8px; 
    }

    #bottom-bar { 
      display: flex; 
      gap: 6px; 
      padding: 8px 0; 
      flex-shrink: 0; 
      flex-wrap: wrap; 
      justify-content: center; 
      align-items: center;
    }
    
    .bottom-btn { 
      background: var(--color-luminous-fill); 
      border: none; 
      border-radius: var(--radius-buttons); 
      box-shadow: var(--shadow-subtle); 
      font-size: 14px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 4px; 
      color: var(--color-frost-glow); 
      transition: all 0.2s; 
      font-weight: 500; 
      padding: 8px 12px;
      height: 44px;
      backdrop-filter: blur(10px);
    }
    
    .bottom-btn.active { 
      background: var(--color-void-violet); 
      color: white; 
      box-shadow: 0 0 12px rgba(102, 58, 243, 0.5);
    }
    
    .bottom-btn:active { 
      transform: scale(0.95); 
    }
    
    .bottom-btn.small { 
      width: 44px;
      padding: 8px;
      font-size: 18px; 
    }

    .modal-overlay { 
      position: fixed; 
      inset: 0; 
      background: rgba(5, 6, 15, 0.8); 
      backdrop-filter: blur(8px); 
      z-index: 100; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.3s; 
    }
    
    .modal-overlay.show { 
      opacity: 1; 
      pointer-events: auto; 
    }
    
    .modal { 
      background: rgba(5, 6, 15, 0.97); 
      width: 90%; 
      max-width: 720px; 
      max-height: 85%; 
      overflow-y: auto; 
      border-radius: var(--radius-modals); 
      padding: 24px; 
      box-shadow: var(--shadow-subtle-6); 
      transform: translateY(30px); 
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2); 
      border: 1px solid var(--color-glass-edge);
    }
    
    .modal-overlay.show .modal { 
      transform: translateY(0); 
    }
    
    .modal h2, .modal h3 { 
      margin-bottom: 16px; 
      color: var(--color-ice-highlight);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    
    .modal-close { 
      float: right; 
      background: none; 
      border: none; 
      font-size: 28px; 
      cursor: pointer; 
      color: var(--color-frost-glow); 
    }

    .action-row { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      margin-top: 16px; 
    }
    
    .action-btn { 
      background: var(--color-luminous-fill); 
      border: 1px solid var(--color-glass-edge); 
      padding: 12px 18px; 
      border-radius: var(--radius-buttons); 
      font-size: 15px; 
      cursor: pointer; 
      box-shadow: var(--shadow-subtle); 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      color: var(--color-frost-glow); 
      transition: all 0.2s; 
      backdrop-filter: blur(10px);
    }
    
    .action-btn.primary { 
      background: var(--color-void-violet); 
      color: white; 
      box-shadow: 0 0 12px rgba(102, 58, 243, 0.5);
    }
    
    .action-btn:active { 
      transform: scale(0.95); 
    }

    .puzzles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    
    .puzzle-card {
      background: rgba(186, 214, 247, 0.03);
      border-radius: var(--radius-cards);
      padding: 12px;
      box-shadow: var(--shadow-subtle);
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      border: 1px solid var(--color-glass-edge);
    }
    
    .puzzle-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    .puzzle-card.solved {
      border: 2px solid #269684;
    }
    
    .puzzle-card .name {
      font-size: 14px;
      font-weight: 500;
      margin-top: 6px;
      color: var(--color-frost-glow);
    }
    
    .puzzle-card .meta {
      font-size: 11px;
      color: var(--color-moon-mist);
    }

    .full-preview-container {
      margin-top: 20px;
      padding: 16px;
      background: rgba(186, 214, 247, 0.03);
      border-radius: var(--radius-cards);
      border: 1px solid var(--color-glass-edge);
      text-align: center;
    }
    
    .full-preview-container h3 {
      margin-bottom: 12px;
      color: var(--color-blueprint-blue);
    }
    
    .full-preview-container canvas {
      max-width: 100%;
      border-radius: 8px;
      background: rgba(199, 211, 234, 0.06);
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-100%) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      animation: confetti-fall 3s linear forwards;
      z-index: 200;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .bottom-btn { 
        font-size: 13px; 
        height: 40px; 
        padding: 8px 10px;
      }
      .bottom-btn.small { 
        width: 40px;
        font-size: 16px; 
      }
      .top-btn { 
        width: 40px; 
        height: 40px; 
        font-size: 18px; 
      }
      .puzzles-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
    }
  </style>
</head>

<div id="app">
  <div id="top-bar">
    <button class="top-btn" id="btn-menu" aria-label="Меню">☰</button>
    <div id="puzzle-title">Выберите кроссворд</div>
    <div id="stats">
      <span id="error-count">✕ 0</span>
      <span id="timer">⏱ 00:00</span>
      <button class="top-btn" id="btn-settings" aria-label="Настройки">⚙</button>
    </div>
  </div>
  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="bottom-bar">
    <button class="bottom-btn active" data-mode="paint">⬛ Закрасить</button>
    <button class="bottom-btn" data-mode="x">✕ Крестик</button>
    <button class="bottom-btn" data-mode="memo">🔺 Memo</button>
    <button class="bottom-btn small" id="btn-clear-memo" aria-label="Удалить memo" style="display:none;">🗑</button>
    <button class="bottom-btn small" id="btn-undo" aria-label="Отменить">↺</button>
    <button class="bottom-btn small" id="btn-redo" aria-label="Повторить">↻</button>
    <button class="bottom-btn small" id="btn-clear" aria-label="Очистить всё">✕</button>
    <button class="bottom-btn small" id="btn-hint" aria-label="Подсказка">💡</button>
    <button class="bottom-btn small" id="btn-puzzles" aria-label="Выбор кроссворда">📚</button>
  </div>
</div>

<div class="modal-overlay" id="modal-puzzles">
  <div class="modal">
    <button class="modal-close" data-close="modal-puzzles">×</button>
    <h2>📚 Коллекция кроссвордов</h2>
    <p style="margin-bottom: 16px; color: var(--color-moon-mist);">Выберите кроссворд для решения. Решённые отмечены зелёным.</p>
    <div class="puzzles-grid" id="puzzles-grid"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-win">
  <div class="modal">
    <h2>🎉 Кроссворд решён!</h2>
    <div id="win-stats"></div>
    <div class="action-row">
      <button class="action-btn primary" id="btn-next-puzzle">Следующий</button>
      <button class="action-btn" id="btn-all-puzzles">К списку</button>
      <button class="action-btn" id="btn-restart">Заново</button>
    </div>
  </div>
</div>

    // Функция для генерации сетки из подсказок
    function generateFromHints(rowHints, colHints) {
      // Упрощённая генерация - создаём симметричный паттерн
      const size = 30;
      const grid = Array(size).fill().map(() => Array(size).fill(0));
      
      // Заполняем на основе подсказок (упрощённо)
      for (let i = 0; i < size; i++) {
        const hint = rowHints[i] || 0;
        if (hint > 0) {
          const startCol = Math.floor((size - hint) / 2);
          for (let j = startCol; j < startCol + hint; j++) {
            grid[i][j] = 1;
          }
        }
      }
      
      return grid.map(row => row.join(''));
    }

    // ===================== GAME STATE =====================
    class GameState {
      constructor(rows) {
        this.rows = rows.map(r => r.split('').map(Number));
        this.size = this.rows.length;
        this.grid = Array(this.size).fill().map(() => Array(this.size).fill(0));
        this.memoGrid = Array(this.size).fill().map(() => Array(this.size).fill(0));
        this.hintCells = new Set();
        this.solvedLines = { rows: new Set(), cols: new Set() };
        this.errors = 0;
        this.hintsLeft = 3;
        this.history = [];
        this.redoStack = [];
        this.startTime = Date.now();
        this.timerInterval = null;
        this.solved = false;
      }
      
      getCell(r, c) { return this.grid[r][c]; }
      getMemo(r, c) { return this.memoGrid[r][c]; }
      
      setCell(r, c, val, record = true) {
        if (record) {
          this.history.push({
            type: 'single',
            r, c, 
            prev: this.grid[r][c], 
            next: val,
            prevMemo: this.memoGrid[r][c],
            nextMemo: this.memoGrid[r][c]
          });
          if (this.history.length > 200) this.history.shift();
          this.redoStack = [];
        }
        this.grid[r][c] = val;
        
        if (val === 1) {
          const hintKey = `${r},${c}`;
          if (this.hintCells.has(hintKey)) {
            this.hintCells.delete(hintKey);
          }
        }
        
        this.autoFillLine(r, c);
        this.checkSolvedLines();
      }
      
      setCellGroup(cells, record = true) {
        if (record) {
          const groupHistory = {
            type: 'group',
            cells: cells.map(({r, c}) => ({
              r, c, 
              prev: this.grid[r][c], 
              next: this.grid[r][c] === 1 ? 0 : 1,
              prevMemo: this.memoGrid[r][c],
              nextMemo: this.memoGrid[r][c]
            }))
          };
          
          this.history.push(groupHistory);
          if (this.history.length > 200) this.history.shift();
          this.redoStack = [];
        }
        
        cells.forEach(({r, c}) => {
          if (this.grid[r][c] !== 1) {
            this.grid[r][c] = 1;
          }
          this.autoFillLine(r, c);
        });
        
        this.checkSolvedLines();
      }
      
      setMemo(r, c, val, record = true) {
        if (record) {
          this.history.push({
            type: 'single',
            r, c, 
            prev: this.grid[r][c], 
            next: this.grid[r][c],
            prevMemo: this.memoGrid[r][c],
            nextMemo: val
          });
          if (this.history.length > 200) this.history.shift();
          this.redoStack = [];
        }
        this.memoGrid[r][c] = val;
      }
      
      clearAllMemos() {
        for (let r = 0; r < this.size; r++) {
          for (let c = 0; c < this.size; c++) {
            this.memoGrid[r][c] = 0;
          }
        }
      }
      
      hasMemos() {
        for (let r = 0; r < this.size; r++) {
          for (let c = 0; c < this.size; c++) {
            if (this.memoGrid[r][c] > 0) return true;
          }
        }
        return false;
      }
      
      addHint(r, c) { this.hintCells.add(`${r},${c}`); }
      hasHint(r, c) { return this.hintCells.has(`${r},${c}`); }
      
      checkSolvedLines() {
        for (let r = 0; r < this.size; r++) {
          const rowHints = this.getLineHints(this.rows[r]);
          const rowFilled = this.grid[r].filter(v => v === 1).length;
          const rowTarget = rowHints.reduce((a, b) => a + b, 0);
          
          if (rowFilled === rowTarget) this.solvedLines.rows.add(r);
          else this.solvedLines.rows.delete(r);
        }
        
        for (let c = 0; c < this.size; c++) {
          const colVals = [];
          for (let r = 0; r < this.size; r++) colVals.push(this.rows[r][c]);
          const colHints = this.getLineHints(colVals);
          const colFilled = this.grid.filter(row => row[c] === 1).length;
          const colTarget = colHints.reduce((a, b) => a + b, 0);
          
          if (colFilled === colTarget) this.solvedLines.cols.add(c);
          else this.solvedLines.cols.delete(c);
        }
      }
      
      autoFillLine(r, c) {
        const rowHints = this.getLineHints(this.rows[r]);
        const rowFilled = this.grid[r].filter(v => v === 1).length;
        const rowTarget = rowHints.reduce((a, b) => a + b, 0);
        
        const allRowCorrect = this.grid[r].every((v, i) => 
          v !== 1 || this.rows[r][i] === 1
        );
        
        if (rowFilled === rowTarget && allRowCorrect) {
          for (let i = 0; i < this.size; i++) {
            if (this.grid[r][i] === 0) this.grid[r][i] = 2;
          }
        }
        
        const colVals = [];
        for (let i = 0; i < this.size; i++) colVals.push(this.rows[i][c]);
        const colHints = this.getLineHints(colVals);
        const colFilled = this.grid.filter(row => row[c] === 1).length;
        const colTarget = colHints.reduce((a, b) => a + b, 0);
        
        const allColCorrect = this.grid.every((row, i) => 
          row[c] !== 1 || this.rows[i][c] === 1
        );
        
        if (colFilled === colTarget && allColCorrect) {
          for (let i = 0; i < this.size; i++) {
            if (this.grid[i][c] === 0) this.grid[i][c] = 2;
          }
        }
      }
      
      getLineHints(line) {
        const hints = [];
        let count = 0;
        line.forEach(v => {
          if (v === 1) count++;
          else {
            if (count > 0) hints.push(count);
            count = 0;
          }
        });
        if (count > 0) hints.push(count);
        return hints.length ? hints : [0];
      }
      
      undo() { 
        if (this.history.length) { 
          const last = this.history.pop();
          
          if (last.type === 'group') {
            last.cells.forEach(({r, c, prev, prevMemo}) => {
              this.grid[r][c] = prev;
              this.memoGrid[r][c] = prevMemo;
            });
            this.redoStack.push(last);
          } else {
            this.grid[last.r][last.c] = last.prev; 
            this.memoGrid[last.r][last.c] = last.prevMemo;
            this.redoStack.push(last);
          }
          
          this.checkSolvedLines();
          return true; 
        } 
        return false; 
      }
      
      redo() { 
        if (this.redoStack.length) { 
          const last = this.redoStack.pop();
          
          if (last.type === 'group') {
            last.cells.forEach(({r, c, next, nextMemo}) => {
              this.grid[r][c] = next;
              this.memoGrid[r][c] = nextMemo;
            });
            this.history.push(last);
          } else {
            this.grid[last.r][last.c] = last.next; 
            this.memoGrid[last.r][last.c] = last.nextMemo;
            this.history.push(last);
          }
          
          this.checkSolvedLines();
          return true; 
        } 
        return false; 
      }
      
      isSolved() { 
        for (let r = 0; r < this.size; r++) {
          for (let c = 0; c < this.size; c++) {
            if (this.rows[r][c] === 1 && this.grid[r][c] !== 1) return false;
            if (this.rows[r][c] === 0 && this.grid[r][c] === 1) return false;
          }
        }
        return true;
      }
    }

      play(freq, dur, vol = 0.3) {
        if (!this.enabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator(); 
          const gain = this.ctx.createGain();
          osc.type = 'sine'; 
          osc.frequency.value = freq; 
          gain.gain.value = vol;
          osc.connect(gain); 
          gain.connect(this.ctx.destination);
          osc.start(); 
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
          osc.stop(this.ctx.currentTime + dur);
        } catch(e) {}
      },
      tap() { this.play(600, 0.03, 0.3); },
      error() { this.play(200, 0.1, 0.3); },

    // ===================== RENDERER =====================
    class Renderer {
      constructor(canvas) {
        this.canvas = canvas; 
        this.ctx = canvas.getContext('2d');
        this.zoom = 1; 
        this.offsetX = 0; 
        this.offsetY = 0;
        this.cellSize = 30; 
        this.state = null;
        this.drawingLine = null;
        this.staticCanvas = document.createElement('canvas');
        this.staticCtx = this.staticCanvas.getContext('2d');
        this.needsStaticRedraw = true;
      }
      
      setState(state) { 
        this.state = state; 
        this.computeSizes(); 
        this.fitBoard(); 
        this.needsStaticRedraw = true;
        this.draw(); 
      }
      
      computeSizes() {
        const wrap = document.getElementById('canvas-wrap');
        const w = wrap.clientWidth - 20;
        const h = wrap.clientHeight - 20;
        const size = this.state.size;
        
        const maxHints = this.getMaxHints();
        const hintSpace = Math.max(40, maxHints * 15);
        
        const availableW = w - hintSpace;
        const availableH = h - hintSpace;
        this.cellSize = Math.min(availableW / size, availableH / size);
        this.cellSize = Math.max(6, Math.min(30, this.cellSize));
        
        this.canvas.width = w;
        this.canvas.height = h;
        this.staticCanvas.width = w;
        this.staticCanvas.height = h;
      }
      
      getMaxHints() {
        if (!this.state) return 5;
        let maxHints = 0;
        for (let r = 0; r < this.state.size; r++) {
          const hints = this.state.getLineHints(this.state.rows[r]);
          maxHints = Math.max(maxHints, hints.length);
        }
        for (let c = 0; c < this.state.size; c++) {
          const colVals = [];
          for (let r = 0; r < this.state.size; r++) colVals.push(this.state.rows[r][c]);
          const hints = this.state.getLineHints(colVals);
          maxHints = Math.max(maxHints, hints.length);
        }
        return maxHints;
      }
      
      fitBoard() {
        const size = this.state.size;
        const boardW = size * this.cellSize;
        const boardH = size * this.cellSize;
        const maxHints = this.getMaxHints();
        const hintSpace = Math.max(40, maxHints * 15);
        
        this.offsetX = (this.canvas.width - boardW) / 2 + hintSpace / 2;
        this.offsetY = (this.canvas.height - boardH) / 2 + hintSpace / 2;
        this.zoom = 1;
      }
      
      screenToCell(x, y) {
        const r = Math.floor((y - this.offsetY) / (this.cellSize * this.zoom));
        const c = Math.floor((x - this.offsetX) / (this.cellSize * this.zoom));
        return {r, c};
      }
      
      setDrawingLine(cells) {
        this.drawingLine = cells;
        this.draw();
      }
      
      clearDrawingLine() {
        this.drawingLine = null;
        this.draw();
      }
      
      draw() {
        const ctx = this.ctx; 
        const w = this.canvas.width, h = this.canvas.height;
        
        if (!this.state) return;
        
        if (this.needsStaticRedraw) {
          this.drawStatic();
          this.needsStaticRedraw = false;
        }
        
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(this.staticCanvas, 0, 0);
        
        this.drawDynamic();
      }
      
      drawStatic() {
        const ctx = this.staticCtx;
        const w = this.canvas.width, h = this.canvas.height;
        ctx.clearRect(0, 0, w, h);
        
        const cell = this.cellSize * this.zoom;
        const size = this.state.size;
        
        ctx.fillStyle = 'rgba(186, 214, 247, 0.03)';
        ctx.fillRect(0, 0, w, h);
        
        this.drawHints(ctx, cell, size);
        
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const x = c * cell + this.offsetX;
            const y = r * cell + this.offsetY;
            
            if (x + cell < 0 || x > w || y + cell < 0 || y > h) continue;
            
            const val = this.state.grid[r][c];
            const memoVal = this.state.memoGrid[r][c];
            const hasHint = this.state.hasHint(r, c);
            const rowSolved = this.state.solvedLines.rows.has(r);
            const colSolved = this.state.solvedLines.cols.has(c);
            
            ctx.fillStyle = 'rgba(199, 211, 234, 0.06)';
            ctx.fillRect(x, y, cell, cell);
            
            if (rowSolved || colSolved) {
              ctx.fillStyle = 'rgba(38, 150, 132, 0.15)';
              ctx.fillRect(x, y, cell, cell);
            }
            
            if (hasHint) {
              ctx.fillStyle = 'rgba(0, 200, 255, 0.7)';
              ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
            }
            
            if (val === 1) {
              ctx.fillStyle = '#000000';
              ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
            } else if (val === 2) {
              ctx.strokeStyle = '#9da7ba';
              ctx.lineWidth = Math.max(1, cell / 6);
              ctx.beginPath(); 
              ctx.moveTo(x + cell * 0.2, y + cell * 0.2); 
              ctx.lineTo(x + cell * 0.8, y + cell * 0.8); 
              ctx.stroke();
              ctx.beginPath(); 
              ctx.moveTo(x + cell * 0.8, y + cell * 0.2); 
              ctx.lineTo(x + cell * 0.2, y + cell * 0.8); 
              ctx.stroke();
            }
            
            if (memoVal === 1) {
              ctx.fillStyle = '#ff0000';
              ctx.beginPath();
              ctx.moveTo(x + cell * 0.5, y + cell * 0.1);
              ctx.lineTo(x + cell * 0.1, y + cell * 0.9);
              ctx.lineTo(x + cell * 0.9, y + cell * 0.9);
              ctx.closePath();
              ctx.fill();
            }
            
            if (cell > 5) {
              ctx.strokeStyle = 'rgba(182, 217, 252, 0.3)';
              ctx.lineWidth = 0.5;
              ctx.strokeRect(x + 0.5, y + 0.5, cell - 1, cell - 1);
            }
            
            if ((r + 1) % 5 === 0 || (c + 1) % 5 === 0) {
              ctx.strokeStyle = '#027dea';
              ctx.lineWidth = 2;
              if ((c + 1) % 5 === 0) {
                ctx.beginPath();
                ctx.moveTo(x + cell, y);
                ctx.lineTo(x + cell, y + cell);
                ctx.stroke();
              }
              if ((r + 1) % 5 === 0) {
                ctx.beginPath();
                ctx.moveTo(x, y + cell);
                ctx.lineTo(x + cell, y + cell);
                ctx.stroke();
              }
            }
          }
        }
        
        ctx.strokeStyle = '#027dea';
        ctx.lineWidth = 3;
        ctx.strokeRect(
          this.offsetX, 
          this.offsetY, 
          size * cell, 
          size * cell
        );
      }
      
      drawDynamic() {
        const ctx = this.ctx;
        const cell = this.cellSize * this.zoom;
        
        if (this.drawingLine) {
          this.drawingLine.forEach(({r, c, num}) => {
            const x = c * cell + this.offsetX;
            const y = r * cell + this.offsetY;
            ctx.fillStyle = '#663af3';
            ctx.font = `bold ${Math.max(10, cell * 0.6)}px 'Inter', system-ui`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(num, x + cell / 2, y + cell / 2);
          });
        }
        
        if (this.errorCells) {
          this.errorCells.forEach(([r,c]) => {
            const x = c * cell + this.offsetX, y = r * cell + this.offsetY;
            ctx.fillStyle = 'rgba(255,0,0,0.35)'; 
            ctx.fillRect(x, y, cell, cell);
          });
        }
      }
      
      drawHints(ctx, cell, size) {
        let maxRowHints = 0;
        let maxColHints = 0;
        
        for (let r = 0; r < size; r++) {
          const hints = this.state.getLineHints(this.state.rows[r]);
          maxRowHints = Math.max(maxRowHints, hints.length);
        }
        
        for (let c = 0; c < size; c++) {
          const colVals = [];
          for (let r = 0; r < size; r++) colVals.push(this.state.rows[r][c]);
          const hints = this.state.getLineHints(colVals);
          maxColHints = Math.max(maxColHints, hints.length);
        }
        
        const maxHints = Math.max(maxRowHints, maxColHints);
        const hintSize = Math.max(6, Math.min(cell * 0.6, 25 / maxHints));
        
        ctx.font = `${hintSize}px 'Inter', system-ui`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        for (let r = 0; r < size; r++) {
          const hints = this.state.getLineHints(this.state.rows[r]);
          let x = this.offsetX - 8;
          let y = r * cell + this.offsetY + cell / 2;
          
          if (this.state.solvedLines.rows.has(r)) {
            ctx.fillStyle = 'rgba(157, 167, 186, 0.5)';
          } else {
            ctx.fillStyle = '#d1e4fa';
          }
          
          hints.forEach((hint, index) => {
            const hintX = x - index * hintSize * 1.2;
            ctx.fillText(hint, hintX, y);
          });
        }
        
        for (let c = 0; c < size; c++) {
          const colVals = [];
          for (let r = 0; r < size; r++) colVals.push(this.state.rows[r][c]);
          const hints = this.state.getLineHints(colVals);
          
          let y = this.offsetY - 8;
          let x = c * cell + this.offsetX + cell / 2;
          
          if (this.state.solvedLines.cols.has(c)) {
            ctx.fillStyle = 'rgba(157, 167, 186, 0.5)';
          } else {
            ctx.fillStyle = '#d1e4fa';
          }
          
          hints.forEach((hint, index) => {
            const hintY = y - index * hintSize * 1.2;
            ctx.fillText(hint, x, hintY);
          });
        }
      }
    }

    // ===================== INPUT HANDLER =====================
    class InputHandler {
      constructor(renderer, game, callbacks) {
        this.renderer = renderer; 
        this.game = game; 
        this.cb = callbacks;
        this.canvas = renderer.canvas;
        this.mode = 'paint';
        this.protectionEnabled = false;
        this.pointerDown = false;
        this.startX = 0; 
        this.startY = 0;
        this.startTime = 0;
        this.lastCell = null;
        this.isDrawing = false;
        this.hasMoved = false;
        this.drawnCells = [];
        this.drawingStartCell = null;
        this.drawDirection = null;
        
        this.canvas.addEventListener('pointerdown', this.onPointerDown.bind(this));
        this.canvas.addEventListener('pointermove', this.onPointerMove.bind(this));
        this.canvas.addEventListener('pointerup', this.onPointerUp.bind(this));
        this.canvas.addEventListener('pointercancel', this.onPointerUp.bind(this));
        this.canvas.addEventListener('dblclick', e => e.preventDefault());
        this.canvas.addEventListener('contextmenu', e => e.preventDefault());
      }
      
      setMode(mode) { this.mode = mode; }
      setProtection(enabled) { this.protectionEnabled = enabled; }
      
      onPointerDown(e) {
        e.preventDefault();
        this.pointerDown = true;
        this.hasMoved = false;
        this.isDrawing = false;
        this.drawnCells = [];
        this.drawingStartCell = null;
        this.drawDirection = null;
        this.startX = e.clientX; 
        this.startY = e.clientY;
        this.startTime = Date.now();
        
        const rect = this.canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
        this.lastCell = this.renderer.screenToCell(x, y);
        this.drawingStartCell = this.lastCell;
      }
      
      onPointerMove(e) {
        if (!this.pointerDown) return;
        e.preventDefault();
        
        const dx = e.clientX - this.startX;
        const dy = e.clientY - this.startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
          this.hasMoved = true;
          this.isDrawing = true;
        }
        
        if (this.isDrawing) {
          const rect = this.canvas.getBoundingClientRect();
          const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
          const y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
          const cell = this.renderer.screenToCell(x, y);
          
          if (cell && cell.r >= 0 && cell.c >= 0 && cell.r < this.game.size && cell.c < this.game.size) {
            if (!this.drawDirection && this.drawingStartCell) {
              const dr = cell.r - this.drawingStartCell.r;
              const dc = cell.c - this.drawingStartCell.c;
              
              if (Math.abs(dr) > Math.abs(dc)) {
                this.drawDirection = 'vertical';
              } else if (Math.abs(dc) > Math.abs(dr)) {
                this.drawDirection = 'horizontal';
              }
            }
            
            if (this.drawDirection === 'vertical') {
              if (cell.c !== this.drawingStartCell.c) return;
            } else if (this.drawDirection === 'horizontal') {
              if (cell.r !== this.drawingStartCell.r) return;
            }
            
            const cellKey = `${cell.r},${cell.c}`;
            if (!this.drawnCells.some(d => d.r === cell.r && d.c === cell.c)) {
              this.drawnCells.push({r: cell.r, c: cell.c, num: this.drawnCells.length + 1});
              
              if (this.mode === 'paint') {
                if (this.game.getCell(cell.r, cell.c) !== 1) {
                  this.game.grid[cell.r][cell.c] = 1;
                }
                this.renderer.setDrawingLine(this.drawnCells);
              }
            }
            this.lastCell = cell;
          }
        }
      }
      
      onPointerUp(e) {
        e.preventDefault();
        
        if (this.isDrawing && this.drawnCells.length > 0) {
          this.game.setCellGroup(this.drawnCells);
          
          this.drawnCells.forEach(({r, c}) => {
            if (this.game.grid[r][c] === 1 && this.game.rows[r][c] !== 1) {
              this.game.errors++;
            }
          });
          
          if (this.game.isSolved()) {
            this.cb.onWin();
          } else {
            this.cb.onUpdate();
          }
          
          Haptics.tap(); 
          SoundManager.tap();
        } else if (!this.hasMoved && this.pointerDown) {
          const elapsed = Date.now() - this.startTime;
          const rect = this.canvas.getBoundingClientRect();
          const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
          const y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
          const cell = this.renderer.screenToCell(x, y);
          
          if (cell && cell.r >= 0 && cell.c >= 0 && cell.r < this.game.size && cell.c < this.game.size) {
            if (!this.protectionEnabled || elapsed > 150) {
              this.applyAction(cell.r, cell.c);
            }
          }
        }
        
        this.renderer.clearDrawingLine();
        this.renderer.needsStaticRedraw = true;
        this.renderer.draw();
        
        this.pointerDown = false;
        this.isDrawing = false;
        this.hasMoved = false;
        this.lastCell = null;
        this.drawnCells = [];
        this.drawingStartCell = null;
        this.drawDirection = null;
      }
      
      applyAction(r, c) {
        if (this.game.solved) return;
        
        if (this.mode === 'paint') {
          const cur = this.game.getCell(r, c);
          const newVal = cur === 1 ? 0 : 1;
          this.game.setCell(r, c, newVal);
          Haptics.tap(); 
          SoundManager.tap();
          
          if (newVal === 1 && this.game.rows[r][c] !== 1) { 
            this.game.errors++; 
            this.cb.onError(r, c); 
          } else {
            this.cb.onUpdate();
          }
          
          if (this.game.isSolved()) this.cb.onWin();
        } else if (this.mode === 'x') {
          const cur = this.game.getCell(r, c);
          const newVal = cur === 2 ? 0 : 2;
          this.game.setCell(r, c, newVal);
          Haptics.mode(); 
          SoundManager.mode();
          this.cb.onUpdate();
        } else if (this.mode === 'memo') {
          const cur = this.game.getMemo(r, c);
          const newVal = cur > 0 ? 0 : 1;
          this.game.setMemo(r, c, newVal);
          Haptics.mode(); 
          SoundManager.mode();
          this.cb.onUpdate();
          this.cb.onMemoChange();
        }
        
        this.renderer.needsStaticRedraw = true;
        this.renderer.draw();
      }
    }

    // ===================== UI =====================
    const UI = {
      game: null, 
      renderer: null, 
      inputHandler: null,
      currentPuzzleIndex: 0,
      saveTimeout: null,
      
      init() {
        try {
          SoundManager.init();
          this.renderer = new Renderer(document.getElementById('game-canvas'));
          this.bindEvents();
          this.showPuzzleSelector();
          this.loadPuzzle(0);
        } catch (error) {
          console.error('Ошибка инициализации:', error);
        }
      },
      
      bindEvents() {
        document.getElementById('btn-menu').onclick = () => this.showModal('modal-puzzles');
        document.getElementById('btn-puzzles').onclick = () => this.showModal('modal-puzzles');
        document.getElementById('btn-undo').onclick = () => this.undo();
        document.getElementById('btn-redo').onclick = () => this.redo();
        document.getElementById('btn-clear').onclick = () => this.clearPuzzle();
        document.getElementById('btn-clear-memo').onclick = () => this.clearMemos();
        document.getElementById('btn-hint').onclick = () => this.giveHint();
        
        document.querySelectorAll('[data-mode]').forEach(btn => 
          btn.onclick = e => {
            const mode = e.target.dataset.mode;
            this.inputHandler.setMode(mode); 
            document.querySelectorAll('.bottom-btn').forEach(b => b.classList.remove('active')); 
            e.target.classList.add('active');
          }
        );
        
        document.querySelectorAll('[data-close]').forEach(btn => 
          btn.onclick = () => this.hideModal(btn.dataset.close)
        );
        
        document.getElementById('btn-next-puzzle').onclick = () => {
          this.hideModal('modal-win');
          const nextIndex = (this.currentPuzzleIndex + 1) % PUZZLES.length;
          this.loadPuzzle(nextIndex);
        };
        
        document.getElementById('btn-all-puzzles').onclick = () => {
          this.hideModal('modal-win');
          this.showModal('modal-puzzles');
        };
        
        document.getElementById('btn-restart').onclick = () => {
          this.hideModal('modal-win');
          this.loadPuzzle(this.currentPuzzleIndex);
        };
      },
      
      showModal(id) { 
        document.getElementById(id).classList.add('show'); 
      },
      
      hideModal(id) { 
        document.getElementById(id).classList.remove('show'); 
      },
      
      loadPuzzle(index) {
        this.currentPuzzleIndex = index;
        const puzzle = PUZZLES[index];
        this.game = new GameState(puzzle.rows);
        this.game.puzzleName = puzzle.name;
        
        const progress = Storage.get('puzzleProgress', {});
        if (progress[index] && progress[index].grid) {
          this.game.grid = progress[index].grid;
          this.game.memoGrid = progress[index].memoGrid || Array(this.game.size).fill().map(() => Array(this.game.size).fill(0));
          this.game.errors = progress[index].errors || 0;
          if (progress[index].solved) this.game.solved = true;
        }
        
        this.renderer.setState(this.game);
        
        this.inputHandler = new InputHandler(this.renderer, this.game, {
          onUpdate: () => {
            this.renderer.draw();
            this.updateMemoButton();
            this.debouncedSave();
          },
          onError: (r, c) => { 
            this.renderer.errorCells = [[r, c]]; 
            setTimeout(() => {
              this.renderer.errorCells = null; 
              this.renderer.draw();
            }, 300); 
            Haptics.error(); 
            SoundManager.error(); 
          },
          onWin: () => this.winPuzzle(),
          onMemoChange: () => {
            this.updateMemoButton();
            this.debouncedSave();
          }
        });
        
        this.renderer.draw();
        this.updateTitle();
        this.startTimer();
        this.updateStats();
        this.updateMemoButton();
      },
      
      debouncedSave() {
        clearTimeout(this.saveTimeout);
        this.saveTimeout = setTimeout(() => {
          this.saveProgress();
        }, 500);
      },
      
      updateTitle() { 
        document.getElementById('puzzle-title').textContent = 
          `${this.game.puzzleName} ${this.game.size}x${this.game.size}`; 
      },
      
      updateStats() { 
        document.getElementById('error-count').textContent = `✕ ${this.game.errors}`; 
      },
      
      updateMemoButton() {
        const btn = document.getElementById('btn-clear-memo');
        if (this.game && this.game.hasMemos()) {
          btn.style.display = 'flex';
        } else {
          btn.style.display = 'none';
        }
      },
      
      startTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        const startTime = Date.now();
        this.timerInterval = setInterval(() => { 
          if (this.game && !this.game.solved) {
            const elapsed = Date.now() - startTime;
            const s = Math.floor(elapsed / 1000);
            document.getElementById('timer').textContent = 
              `⏱ ${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`; 
          }
        }, 1000);
      },
      
      winPuzzle() {
        this.game.solved = true;
        SoundManager.win(); 
        Haptics.win();
        
        this.showModal('modal-win');
        document.getElementById('win-stats').innerHTML = 
          `Кроссворд: ${this.game.puzzleName}<br>` +
          `Время: ${this.formatTime(Date.now() - this.game.startTime)}<br>` +
          `Ошибки: ${this.game.errors}<br>` +
          `Размер: ${this.game.size}x${this.game.size}`;
        
        this.saveProgress(true);
        this.spawnConfetti();
      },
      
      spawnConfetti() {
        const colors = ['#663af3', '#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#ff9ff3', '#54a0ff'];
        for (let i = 0; i < 80; i++) {
          setTimeout(() => {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.top = '-10px';
            piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            piece.style.width = (Math.random() * 8 + 5) + 'px';
            piece.style.height = (Math.random() * 8 + 5) + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            document.body.appendChild(piece);
            
            setTimeout(() => {
              piece.remove();
            }, 3000);
          }, Math.random() * 2000);
        }
      },
      
      formatTime(ms) { 
        const s = Math.floor(ms / 1000); 
        return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`; 
      },
      
      saveProgress(solved = false) {
        const progress = Storage.get('puzzleProgress', {});
        progress[this.currentPuzzleIndex] = {
          solved: solved || this.game.solved,
          grid: this.game.grid,
          memoGrid: this.game.memoGrid,
          errors: this.game.errors
        };
        Storage.set('puzzleProgress', progress);
      },
      
      undo() { 
        if (this.game.undo()) { 
          this.renderer.needsStaticRedraw = true;
          this.renderer.draw(); 
          this.updateMemoButton();
          this.debouncedSave();
          SoundManager.mode(); 
        } 
      },
      
      redo() { 
        if (this.game.redo()) { 
          this.renderer.needsStaticRedraw = true;
          this.renderer.draw(); 
          this.updateMemoButton();
          this.debouncedSave();
          SoundManager.mode(); 
        } 
      },
      
      clearPuzzle() {
        if (this.game) {
          this.game.grid = Array(this.game.size).fill().map(() => Array(this.game.size).fill(0));
          this.game.memoGrid = Array(this.game.size).fill().map(() => Array(this.game.size).fill(0));
          this.game.hintCells.clear();
          this.game.solvedLines.rows.clear();
          this.game.solvedLines.cols.clear();
          this.renderer.needsStaticRedraw = true;
          this.renderer.draw();
          this.updateMemoButton();
          this.debouncedSave();
        }
      },
      
      clearMemos() {
        if (this.game) {
          this.game.clearAllMemos();
          this.renderer.needsStaticRedraw = true;
          this.renderer.draw();
          this.updateMemoButton();
          this.debouncedSave();
        }
      },
      
      giveHint() {
        if (!this.game) return;
        const unsolved = [];
        for (let r = 0; r < this.game.size; r++) 
          for (let c = 0; c < this.game.size; c++) 
            if (this.game.rows[r][c] === 1 && this.game.grid[r][c] !== 1 && !this.game.hasHint(r, c)) 
              unsolved.push([r, c]);
        
        if (unsolved.length) {
          const [r, c] = unsolved[Math.floor(Math.random() * unsolved.length)];
          this.game.addHint(r, c); 
          this.renderer.needsStaticRedraw = true;
          this.renderer.draw();
          Haptics.tap(); 
          SoundManager.tap();
        }
      },
      
      showPuzzleSelector() {
        const grid = document.getElementById('puzzles-grid');
        grid.innerHTML = '';
        
        const progress = Storage.get('puzzleProgress', {});
        
        PUZZLES.forEach((puzzle, index) => {
          const card = document.createElement('div');
          card.className = 'puzzle-card';
          
          const isSolved = progress[index]?.solved || false;
          if (isSolved) card.classList.add('solved');
          
          card.innerHTML = `
            <div class="name">${puzzle.name}</div>
            <div class="meta">${puzzle.size}x${puzzle.size} ${isSolved ? '✅' : ''}</div>
          `;
          
          card.onclick = () => {
            this.hideModal('modal-puzzles');
            this.loadPuzzle(index);
          };
          
          grid.appendChild(card);
        });
      }
    };

    // Запуск
    window.addEventListener('DOMContentLoaded', () => UI.init());
    window.addEventListener('resize', () => { 
      if (UI.renderer && UI.game) { 
        UI.renderer.computeSizes(); 
        UI.renderer.fitBoard(); 
        UI.renderer.needsStaticRedraw = true;
        UI.renderer.draw(); 
      } 
    });
  })();
</script>
