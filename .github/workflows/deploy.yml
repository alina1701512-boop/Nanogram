name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # path: '.' раньше публиковал вообще всё в репозитории, включая .git и
      # .github — собираем в _site только то, что действительно нужно сайту.
      - name: Stage site files
        run: |
          mkdir _site
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
